<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物品上下游查询器 · ECharts 版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
    color: #F1F5F9;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
}
.header {
    padding: 16px 24px;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
}
.header h1 {
    font-size: 18px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
}
.header h1 i { color: #3B82F6; }
.header .subtitle {
    font-size: 12px; color: #94A3B8;
    margin-left: 8px;
}
.toolbar {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
}
.search-box {
    position: relative;
}
.search-box input {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #F1F5F9;
    padding: 8px 12px 8px 36px;
    border-radius: 6px;
    width: 220px;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
}
.search-box input:focus {
    border-color: #3B82F6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}
.search-box i {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: #64748B;
    font-size: 13px;
}
.search-results {
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: #1E293B;
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 6px;
    margin-top: 4px;
    max-height: 320px;
    overflow-y: auto;
    display: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.search-result-item {
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(148, 163, 184, 0.08);
    font-size: 13px;
    display: flex; align-items: center; gap: 8px;
}
.search-result-item:hover { background: rgba(59, 130, 246, 0.15); }
.search-result-item:last-child { border-bottom: none; }
.search-result-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
}
.tool-btn {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #CBD5E1;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
}
.tool-btn:hover {
    background: rgba(59, 130, 246, 0.2);
    border-color: rgba(59, 130, 246, 0.4);
    color: #93C5FD;
}
.depth-control {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #94A3B8;
}
.depth-control input {
    width: 50px;
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #F1F5F9;
    padding: 6px 8px;
    border-radius: 4px;
    text-align: center;
    font-size: 12px;
}
.main {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 65px);
}
.graph-container {
    background: rgba(30, 41, 59, 0.4);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
}
#graph {
    width: 100%; height: 100%;
}
.legend {
    position: absolute;
    bottom: 16px; left: 16px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 11px; color: #CBD5E1;
    z-index: 10;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.sidebar {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    overflow-y: auto;
    padding: 20px;
}
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.2);
    border-radius: 4px;
}
.sidebar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }
.sidebar-empty {
    text-align: center; color: #94A3B8;
    padding: 60px 20px;
}
.sidebar-empty i {
    font-size: 48px; color: #475569; margin-bottom: 16px;
}
.sidebar-empty p { font-size: 14px; line-height: 1.6; }
.selected-item {
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 8px; padding: 14px;
    margin-bottom: 16px;
}
.selected-item h2 {
    font-size: 18px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
}
.selected-item .meta {
    margin-top: 8px; font-size: 12px; color: #CBD5E1;
    display: flex; flex-wrap: wrap; gap: 8px;
}
.tag {
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500;
}
.section-title {
    font-size: 13px; font-weight: 600;
    color: #CBD5E1; margin: 16px 0 8px;
    display: flex; align-items: center; gap: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
}
.section-title i { color: #3B82F6; }
.section-title .count {
    background: rgba(59, 130, 246, 0.2);
    color: #93C5FD; padding: 1px 8px;
    border-radius: 10px; font-size: 11px;
}
.toggle-btn {
    margin-left: auto;
    background: rgba(148, 163, 184, 0.15);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #CBD5E1;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: none;
    letter-spacing: 0;
}
.toggle-btn:hover {
    background: rgba(59, 130, 246, 0.2);
    color: #93C5FD;
    border-color: rgba(59, 130, 246, 0.4);
}
.upstream-list, .downstream-list {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 8px;
}
.upstream-list.collapsed, .downstream-list.collapsed {
    max-height: 110px;
    overflow: hidden;
    position: relative;
}
.upstream-list.collapsed::after, .downstream-list.collapsed::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40px;
    background: linear-gradient(transparent, #1E293B);
    pointer-events: none;
}
.chip {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
}
.chip:hover { transform: translateY(-1px); }
.chip.upstream {
    background: rgba(252, 211, 77, 0.15);
    color: #FCD34D;
    border-color: rgba(252, 211, 77, 0.3);
}
.chip.upstream:hover { background: rgba(252, 211, 77, 0.25); }
.chip.downstream {
    background: rgba(110, 231, 183, 0.15);
    color: #6EE7B7;
    border-color: rgba(110, 231, 183, 0.3);
}
.chip.downstream:hover { background: rgba(110, 231, 183, 0.25); }
.empty-hint {
    font-size: 12px; color: #64748B;
    padding: 8px 0; font-style: italic;
}
.recipe-card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.1);
    border-radius: 8px; padding: 12px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
}
.recipe-card:hover { border-color: rgba(59, 130, 246, 0.4); }
.recipe-card .recipe-header {
    display: flex; justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 11px; color: #94A3B8;
}
.recipe-card .recipe-header .int-badge {
    background: rgba(59, 130, 246, 0.2);
    color: #93C5FD;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
}
.recipe-card .recipe-flow {
    display: flex; align-items: center;
    flex-wrap: wrap; gap: 4px;
    font-size: 13px;
}
.recipe-card .material {
    background: rgba(148, 163, 184, 0.1);
    color: #CBD5E1;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(148, 163, 184, 0.15);
}
.recipe-card .material.is-liquid {
    background: rgba(58, 175, 169, 0.15);
    color: #5EEAD4;
    border-color: rgba(58, 175, 169, 0.3);
}
.recipe-card .material.is-selected {
    background: rgba(59, 130, 246, 0.25);
    color: #93C5FD;
    border-color: rgba(59, 130, 246, 0.5);
    font-weight: 600;
}
.recipe-card .arrow {
    color: #64748B; font-size: 11px;
    margin: 0 2px;
}
.recipe-card .result {
    background: rgba(110, 231, 183, 0.15);
    color: #6EE7B7;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(110, 231, 183, 0.3);
    font-weight: 500;
}
.recipe-card .result.is-selected {
    background: rgba(59, 130, 246, 0.25);
    color: #93C5FD;
    border-color: rgba(59, 130, 246, 0.5);
    font-weight: 600;
}
.recipe-card .cond {
    font-size: 10px;
    background: rgba(245, 158, 11, 0.2);
    color: #FCD34D;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
}
.recipe-card .recipe-meta {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(148, 163, 184, 0.1);
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 11px; color: #94A3B8;
}
</style>
</head>

    </div>
    <div class="sidebar" id="sidebar">

            <i class="fa-solid fa-hand-pointer"></i>
            <p>点击网络图中的任意物品节点<br>查看其上下游关系与配方详情</p>
        </div>
    </div>
</div>

// ============ BFS 找上下游 ============
function findUpstream(itemId, maxDepth) {
    const visited = new Set([itemId]);
    const edges = new Set();
    const queue = [{ id: itemId, depth: 0 }];
    while (queue.length > 0) {
        const { id, depth } = queue.shift();
        if (depth >= maxDepth) continue;
        const upstream = (graphData.adjacency[id] || { upstream: [] }).upstream;
        upstream.forEach(uid => {
            if (!visited.has(uid)) {
                visited.add(uid);
                edges.add(uid + '||' + id);
                queue.push({ id: uid, depth: depth + 1 });
            } else {
                edges.add(uid + '||' + id);
            }
        });
    }
    visited.delete(itemId);
    return { nodes: visited, edges };
}

function findDownstream(itemId, maxDepth) {
    const visited = new Set([itemId]);
    const edges = new Set();
    const queue = [{ id: itemId, depth: 0 }];
    while (queue.length > 0) {
        const { id, depth } = queue.shift();
        if (depth >= maxDepth) continue;
        const downstream = (graphData.adjacency[id] || { downstream: [] }).downstream;
        downstream.forEach(did => {
            if (!visited.has(did)) {
                visited.add(did);
                edges.add(id + '||' + did);
                queue.push({ id: did, depth: depth + 1 });
            } else {
                edges.add(id + '||' + did);
            }
        });
    }
    visited.delete(itemId);
    return { nodes: visited, edges };
}

let selectedItemId = null;

function highlightItem(itemId) {
    selectedItemId = itemId;
    const maxDepth = parseInt(document.getElementById('depthInput').value) || 5;
    const upstream = findUpstream(itemId, maxDepth);
    const downstream = findDownstream(itemId, maxDepth);

    // 更新节点样式
    const newNodes = nodesData.map(n => {
        let color = '#475569';
        let symbolSize = Math.max(8, 8 + Math.min(n.raw.degree, 14));
        let labelShow = false;
        let opacity = 0.25;

        if (n.id === itemId) {
            color = '#3B82F6';
            symbolSize = 30;
            labelShow = true;
            opacity = 1;
        } else if (upstream.nodes.has(n.id)) {
            color = '#FCD34D';
            symbolSize = Math.max(12, 10 + Math.min(n.raw.degree, 16));
            labelShow = true;
            opacity = 1;
        } else if (downstream.nodes.has(n.id)) {
            color = '#6EE7B7';
            symbolSize = Math.max(12, 10 + Math.min(n.raw.degree, 16));
            labelShow = true;
            opacity = 1;
        }
        return {
            ...n,
            symbolSize: symbolSize,
            itemStyle: { color: color, opacity: opacity },
            label: { show: labelShow, position: 'right', color: '#F1F5F9',
                     fontSize: 11, textBorderColor: '#0F172A', textBorderWidth: 2 },
        };
    });

    // 更新边样式
    const newEdges = edgesData.map(e => {
        const key = e.source + '||' + e.target;
        const isUp = upstream.edges.has(key);
        const isDown = downstream.edges.has(key);
        const isDirect = e.source === itemId || e.target === itemId;

        let color = 'rgba(71, 85, 105, 0.1)';
        let width = 0.5;

        if (isDirect) {
            color = '#3B82F6';
            width = 2.5;
        } else if (isUp) {
            color = 'rgba(252, 211, 77, 0.6)';
            width = 1.5;
        } else if (isDown) {
            color = 'rgba(110, 231, 183, 0.6)';
            width = 1.5;
        }
        return {
            ...e,
            lineStyle: { color: color, width: width, curveness: 0.1 },
        };
    });

    myChart.setOption({
        series: [{
            data: newNodes,
            links: newEdges,
        }],
    });

    updateSidebar(itemId, upstream, downstream);
}

            <i class="fa-solid fa-arrow-up"></i> 上游材料
            <span class="count">${upstreamItems.length}</span>
            ${upstreamItems.length > 8 ? `<button class="toggle-btn" data-target="upstream-list">展开/折叠</button>` : ''}
        </div>
    `;
    if (upstreamItems.length === 0) {
        html += '<div class="empty-hint">无上游材料（基础原料）</div>';
    } else {
        const collapsed = upstreamItems.length > 8 ? 'collapsed' : '';
        html += `<div class="upstream-list ${collapsed}">`;
        upstreamItems.forEach(n => {
            html += `<span class="chip upstream" data-id="${n.id}">${n.name}</span>`;
        });
        html += '</div>';
    }

    // 下游物品
    html += `
        <div class="section-title">
            <i class="fa-solid fa-arrow-down"></i> 下游产物
            <span class="count">${downstreamItems.length}</span>
            ${downstreamItems.length > 8 ? `<button class="toggle-btn" data-target="downstream-list">展开/折叠</button>` : ''}
        </div>
    `;
    if (downstreamItems.length === 0) {
        html += '<div class="empty-hint">无下游产物（终端物品）</div>';
    } else {
        const collapsed = downstreamItems.length > 8 ? 'collapsed' : '';
        html += `<div class="downstream-list ${collapsed}">`;
        downstreamItems.forEach(n => {
            html += `<span class="chip downstream" data-id="${n.id}">${n.name}</span>`;
        });
        html += '</div>';
    }

    // 相关配方
    html += `
        <div class="section-title">
            <i class="fa-solid fa-flask"></i> 相关配方
            <span class="count">${recipes.length}</span>
        </div>
    `;
    if (recipes.length === 0) {
        html += '<div class="empty-hint">无相关配方</div>';
    } else {
        recipes.forEach(r => {
            const isResult = r.result_id === itemId;
            const isMaterial = r.materials.some(m => m.id === itemId);
            let role = '';
            if (isResult && isMaterial) role = '<span class="tag" style="background:rgba(59,130,246,0.2);color:#93C5FD">产物+材料</span>';
            else if (isResult) role = '<span class="tag" style="background:rgba(110,231,183,0.2);color:#6EE7B7">作为产物</span>';
            else if (isMaterial) role = '<span class="tag" style="background:rgba(245,158,11,0.2);color:#FCD34D">作为材料</span>';

            let materialsHtml = r.materials.map(m => {
                const isSelected = m.id === itemId;
                const cls = 'material' + (m.is_liquid ? ' is-liquid' : '') + (isSelected ? ' is-selected' : '');
                let cond = '';
                if (m.min_condition && m.min_condition > 0) {
                    cond = m.min_condition >= 1 ? '<span class="cond">需100%</span>' : `<span class="cond">≥${Math.round(m.min_condition*100)}%</span>`;
                }
                return `<span class="${cls}">${m.name}${cond}</span>`;
            }).join('<span class="arrow">+</span>');

            const resultCls = 'result' + (isResult ? ' is-selected' : '');
            const amountStr = r.result_amount > 1 ? ` ×${r.result_amount}` : '';
            const condStr = r.result_condition && r.result_condition > 0 && r.result_is_liquid
                ? `<span class="cond">${r.result_condition}ml</span>` : '';

            html += `
                <div class="recipe-card">
                    <div class="recipe-header">
                        <span>#${r.idx} · ${r.category_label}</span>
                        <span class="int-badge">INT ${r.int_req}</span>
                    </div>
                    <div class="recipe-flow">
                        ${materialsHtml}
                        <span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>
                        <span class="${resultCls}">${r.result_name}${amountStr}${condStr}</span>
                    </div>
                    <div class="recipe-meta">
                        ${role}
                        <span>材料槽位: ${r.total_materials}</span>
                    </div>
                </div>
            `;
        });
    }

    document.getElementById('sidebar').innerHTML = html;

    // 绑定 chip 点击事件
    document.querySelectorAll('.chip[data-id]').forEach(chip => {
        chip.addEventListener('click', () => {
            const id = chip.getAttribute('data-id');
            highlightItem(id);
        });
    });

    // 绑定折叠按钮事件
    document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const targetClass = btn.getAttribute('data-target');
            const target = document.querySelector('.' + targetClass);
            if (target) target.classList.toggle('collapsed');
        });
    });
}

// ============ 节点点击事件 ============
myChart.on('click', function(params) {
    if (params.dataType === 'node') {
        highlightItem(params.data.id);
    }
});

// ============ 搜索功能 ============
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
        searchResults.style.display = 'none';
        return;
    }
    const matches = graphData.nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 20);
    if (matches.length === 0) {
        searchResults.innerHTML = '<div class="search-result-item" style="color:#64748B">无匹配结果</div>';
    } else {
        searchResults.innerHTML = matches.map(n => {
            const catColor = graphData.category_colors[n.category] || '#94A3B8';
            return `<div class="search-result-item" data-id="${n.id}">
                <div class="dot" style="background:${catColor}"></div>
                <span>${n.name}</span>
            </div>`;
        }).join('');
    }
    searchResults.style.display = 'block';
});

searchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.search-result-item');
    if (!item) return;
    const id = item.getAttribute('data-id');
    if (id) {
        highlightItem(id);
        searchInput.value = '';
        searchResults.style.display = 'none';
    }
});

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) {
        searchResults.style.display = 'none';
    }
});

// ============ 重置按钮 ============
document.getElementById('resetBtn').addEventListener('click', () => {
    selectedItemId = null;
    const newNodes = nodesData.map(n => ({
        ...n,
        symbolSize: n.symbolSize,
        itemStyle: { color: n.itemStyle.color, opacity: 1 },
        label: { show: n.label.show, position: 'right', color: '#F1F5F9',
                 fontSize: 11, textBorderColor: '#0F172A', textBorderWidth: 2 },
    }));
    const newEdges = edgesData.map(e => ({
        ...e,
        lineStyle: { color: 'rgba(148, 163, 184, 0.2)', width: 0.8, curveness: 0.1 },
    }));
    myChart.setOption({
        series: [{ data: newNodes, links: newEdges }],
    });
    document.getElementById('sidebar').innerHTML = `
        <div class="sidebar-empty">
            <i class="fa-solid fa-hand-pointer"></i>
            <p>点击网络图中的任意物品节点<br>查看其上下游关系与配方详情</p>
        </div>
    `;
});

// ============ 帮助按钮 ============
document.getElementById('helpBtn').addEventListener('click', () => {
    alert(`使用说明：

1. 点击网络图中任意物品节点 → 自动高亮其上下游
   • 蓝色 = 选中物品
   • 黄色 = 上游材料（用于制造该物品）
   • 绿色 = 下游产物（该物品用于制造什么）

2. 侧边栏显示：
   • 上游/下游物品列表（点击可跳转）
   • 所有相关配方及具体配比
   • 选中物品在配方中以蓝色高亮

3. 搜索框：输入物品名称快速定位

4. 追溯深度：控制上下游查找的层级（默认 5 层）

5. 支持环检测：即使存在循环依赖也能正确追溯

6. ECharts 特性：
   • 鼠标悬停：聚焦相邻节点（focus: adjacency）
   • 滚轮缩放、拖动平移
   • 节点可拖拽重新布局
   • 双击空白处恢复视图`);
});

// ============ 响应式 ============
window.addEventListener('resize', () => {
    myChart.resize();
});

// 默认选中一个示例物品
setTimeout(() => {
    highlightItem('rope');
}, 800);
</script>
